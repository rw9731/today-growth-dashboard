<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>素材产出</title>
<style>
:root{--fg:#1f1f1d;--sub:#6b6a66;--bg:#f7f6f2;--panel:#fff;--line:#e4e2dc;--ok:#1f7a4d;--bad:#c0362c;--v:#3d6fd8;--s:#7c5cc4;--n:#c9a14a;--x:#b8b5ad;--o:#2f9a8f;--link:#2a5bc4;
 --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#ecebe6;--sub:#a3a19a;--bg:#1b1b19;--panel:#242422;--line:#3a3936;--ok:#5fc48f;--bad:#ef6b5f;--v:#7da2ef;--s:#a98be6;--n:#d9b35e;--x:#5a5853;--o:#5cc2b6;--link:#8fb0f5}}
:root[data-theme="dark"]{--fg:#ecebe6;--sub:#a3a19a;--bg:#1b1b19;--panel:#242422;--line:#3a3936;--ok:#5fc48f;--bad:#ef6b5f;--v:#7da2ef;--s:#a98be6;--n:#d9b35e;--x:#5a5853;--o:#5cc2b6;--link:#8fb0f5}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans)}
.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 48px}
a{color:var(--link)}
nav{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;margin-bottom:10px}
nav .cur{font-weight:700}
nav select{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:2px 6px}
h1{font-size:24px;margin:4px 0 2px}
.sub{color:var(--sub);font-size:13px;margin:0 0 14px;max-width:90ch}
h2{font-size:16px;margin:22px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);padding:12px 14px}
.card h3{margin:0 0 6px;font-size:14px}
.big{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:flex-end}
.big div{display:grid}.big b{font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}.big span{font-size:12px;color:var(--sub)}
.bar{display:flex;height:10px;margin:10px 0 4px;background:var(--line);position:relative}
.bar i{display:block;height:100%}.bar .tg{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg)}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub)}.lg i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
.good{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;white-space:nowrap;background:var(--panel);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nw{white-space:nowrap}
td.nm{min-width:280px;max-width:520px;overflow-wrap:anywhere}
.k{display:inline-block;font-size:11px;font-weight:700;padding:0 5px;white-space:nowrap}
.kV{color:var(--v);box-shadow:inset 0 0 0 1px var(--v)}.kS{color:var(--s);box-shadow:inset 0 0 0 1px var(--s)}.kN{color:var(--n);box-shadow:inset 0 0 0 1px var(--n)}.kX{color:var(--sub);box-shadow:inset 0 0 0 1px var(--x)}.kO{color:var(--o);box-shadow:inset 0 0 0 1px var(--o)}
.ty{display:inline-block;font-size:12px;font-weight:700;white-space:nowrap}
.agt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.agt div{display:grid}.agt b{font-size:22px;font-variant-numeric:tabular-nums}.agt span{font-size:12px;color:var(--sub)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px;font-size:13px}
.filters select,.filters input{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:3px 6px;max-width:220px}
.filters .cnt{margin-left:auto;color:var(--sub)}
tr.we td{color:var(--sub)}
.dim{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.dim .row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:8px;align-items:center;font-size:12px;padding:2px 0;cursor:pointer}
.dim .row:hover{background:var(--bg)}
.dim .row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dim .row .b{display:flex;height:8px;background:var(--line)}.dim .row .b i{display:block;height:100%}
.note{font-size:12px;color:var(--sub);margin:6px 0 0}
.card .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}.card .hd h3{margin:0;font-size:15px}
.chip{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.chip.no{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}.chip.mu{color:var(--sub);background:var(--bg)}
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.hero b{font-size:44px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.hero span{font-size:13px;color:var(--sub)}
.gap{font-size:13px;margin:4px 0 0}
.cbar{position:relative;display:flex;height:16px;margin:14px 0 4px;background:var(--line)}.cbar i{display:block;height:100%}.cbar .tg{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg)}.cbar .tl{position:absolute;top:-20px;transform:translateX(-50%);font-size:11px;color:var(--sub);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.stats div{display:grid}.stats b{font-size:18px;font-variant-numeric:tabular-nums}.stats span{font-size:12px;color:var(--sub)}
.stats i{display:inline-block;width:8px;height:8px;margin-right:4px}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.dr{display:grid;grid-template-columns:62px 1fr 168px;gap:8px;align-items:center;padding:5px 0;font-size:12px}
.dr .dd{white-space:nowrap}.dr.we{color:var(--sub)}
.dr .track{position:relative;height:14px}.dr .track .st{display:flex;height:100%}.dr .track .st i{display:block;height:100%}
.dr .track .pl{position:absolute;top:-3px;bottom:-3px;left:0;border:1.5px solid var(--fg);opacity:.45;pointer-events:none}
.dr .track .m20{position:absolute;top:-3px;bottom:-3px;border-left:1px dashed var(--fg);opacity:.55}
.dr .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.dr .r b{font-size:13px}
.dr .none{color:var(--sub);font-size:12px}
.dax{display:grid;grid-template-columns:62px 1fr 168px;gap:8px;font-size:11px;color:var(--sub)}.dax .ax{position:relative;height:14px}.dax .ax span{position:absolute;transform:translateX(-50%)}
@media (min-width:1100px){.scroll.list{overflow:visible}}
.st-ok{color:var(--ok);font-weight:700}.st-bad{color:var(--bad);font-weight:700}.st-mu{color:var(--sub)}
#bt tr.b{cursor:pointer}#bt tr.b:hover td{background:var(--bg)}#bt tr.b td:first-child::before{content:"▸ ";color:var(--sub)}#bt tr.b.open td:first-child::before{content:"▾ "}
#bt tr.dh{cursor:pointer}#bt tr.dh td{background:var(--bg);border-top:2px solid var(--line);padding:9px 8px}#bt tr.dh td::before{content:"▸ ";color:var(--sub)}#bt tr.dh.open td::before{content:"▾ "}
#bt tr.sub td{background:var(--bg);font-size:12px}#bt tr.sub ul{margin:0;padding-left:18px}#bt tr.sub li{margin:2px 0;overflow-wrap:anywhere}
.mini{display:inline-flex;gap:1px;vertical-align:middle;margin-left:6px}.mini i{display:inline-block;width:6px;height:10px;background:var(--line)}.mini i.on{background:var(--v)}
.legend{display:grid;gap:6px;font-size:12px;color:var(--sub);padding:10px 14px}
.legend .lr{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center}.legend b{color:var(--fg)}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}.legend .pl{display:inline-block;width:14px;height:9px;border:1.5px solid var(--fg);opacity:.5;margin-right:5px;vertical-align:-1px}.legend .m{display:inline-block;width:0;height:11px;border-left:1px dashed var(--fg);margin:0 6px 0 2px;vertical-align:-1px}
.tot{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.tot b{font-size:40px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.tot span{font-size:14px;color:var(--sub)}
.prog{position:relative;height:12px;background:var(--line);margin:12px 0 6px}.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--fg);opacity:.85}.prog .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad)}
.pn{font-size:12px;color:var(--sub)}
.l2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.l2 div{display:grid}.l2 b{font-size:16px;font-variant-numeric:tabular-nums}.l2 span{font-size:12px;color:var(--sub)}.l2 small{font-size:12px;color:var(--sub);font-weight:400}
.fl a{margin-right:6px;white-space:nowrap}
.day{margin:0 0 18px}.dayh{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:8px 0 6px;border-bottom:2px solid var(--line);margin-bottom:6px;font-size:13px}.dayh b{font-size:15px}.dayh span b{font-size:14px}
.plan{margin-top:6px}.plan .ph{cursor:pointer;font-size:12px;color:var(--sub);padding:6px 8px;background:var(--panel);border:1px dashed var(--line)}.plan .ph:hover{color:var(--fg)}.plan.open .ph{border-bottom:0}
.lk{font-size:11px;color:var(--sub);border:1px solid var(--line);padding:0 4px;white-space:nowrap}
.dim .row.uc .tg{cursor:pointer;color:var(--sub);font-weight:400;padding:0 2px}.dim .scs{margin:0 0 6px 16px;border-left:2px solid var(--line);padding-left:8px}.dim .row.sc{grid-template-columns:1fr auto 0;font-size:12px}.dim .row.uc{grid-template-columns:minmax(120px,190px) 1fr 58px}
.dim{grid-template-columns:repeat(auto-fit,minmax(380px,1fr));align-items:start}
.dim .more{margin-top:6px;font:inherit;font-size:12px;color:var(--link);background:none;border:0;padding:2px 0;cursor:pointer}
.stg{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}.stg summary{cursor:pointer;color:var(--fg);font-size:16px;line-height:1.4}.stg summary b{font-size:22px;font-variant-numeric:tabular-nums;margin:0 3px}.stg summary .st-mu{font-size:13px}
.stg .sh{margin:8px 0 2px;font-weight:700}.stg ul{margin:0;padding-left:18px}.stg li{margin:2px 0;overflow-wrap:anywhere}.stg .uc{color:var(--sub);margin-right:4px}
</style>
</head>

  const all=Object.entries(m).sort((a,b)=>b[1].n-a[1].n||(b[1].plan||0)-(a[1].plan||0));const mx=Math.max(1,...all.map(r=>r[1].n));
  const rows=UMORE?all:all.slice(0,UTOP),more=all.length>UTOP?`<button class="more" id="umore">${UMORE?'收起':`显示全部 ${all.length} 个 use case`}</button>`:'';
  return `<div class="card"><h3>Use case <small class="st-mu" style="font-weight:400">通过 / 排</small></h3>${rows.map(([u,c])=>{const op=UOPEN.has(u);const scs=Object.entries(c.sc).sort((a,b)=>(b[1].got+b[1].plan)-(a[1].got+a[1].plan));
    return `<div class="row uc" data-f="uc" data-v="${esc(u==='（没标）'?'':u)}" title="变式 ${c.V+c.S}，新测试 ${c.N}"><span class="t"><b class="tg" data-u="${esc(u)}">${op?'▾':'▸'}</b> ${esc(u+(UCN[u]?' '+UCN[u]:''))}</span><span class="b" style="width:${c.n/mx*100}%">${c.n?`<i style="width:${c.V/c.n*100}%;background:var(--v)"></i><i style="width:${c.S/c.n*100}%;background:var(--s)"></i><i style="width:${c.N/c.n*100}%;background:var(--n)"></i><i style="width:${(c.O||0)/c.n*100}%;background:var(--o)"></i>`:''}</span><span class="n" title="交了 / 这周排了">${c.n}${c.plan?`<small class="st-mu">/${c.plan}</small>`:''}</span></div>`+
    (op?`<div class="scs">${scs.map(([s,v])=>`<div class="row sc" data-u="${esc(u)}" data-s="${esc(s)}"><span class="t">${esc(s)}</span><span class="st-mu">交 ${v.got}${v.plan?` · 排 ${v.plan}`:''}</span><span></span></div>`).join('')}</div>`:'')}).join('')}${more}</div>`}
IT.forEach(x=>{x.typ=ty(x);x.srcn=sn(x.g)});
function dims(){document.getElementById('dims').innerHTML=dimBlock('类型','typ')+dimBlock('来源','srcn')+dimBlock('一级分类','l1')+ucBlock()}
dims();
document.getElementById('dims').addEventListener('click',ev=>{
  if(ev.target.closest('#umore')){UMORE=!UMORE;dims();return}
  const tg=ev.target.closest('.tg');if(tg){const u=tg.dataset.u;UOPEN.has(u)?UOPEN.delete(u):UOPEN.add(u);dims();return}
  const sc=ev.target.closest('.row.sc');if(sc){F.uc=sc.dataset.u;F.sc=sc.dataset.s;renderF();draw();document.getElementById('list').scrollIntoView({behavior:'smooth'});return}
  const r=ev.target.closest('.row');if(!r)return;if(r.dataset.f==='typ'){F.t=r.dataset.v}else if(r.dataset.f==='srcn'){F.g=Object.keys(SRC).find(k=>SRC[k]===r.dataset.v)||''}else F[r.dataset.f]=r.dataset.v;if(r.dataset.f==='uc')F.sc='';renderF();draw();document.getElementById('list').scrollIntoView({behavior:'smooth'})});
// 筛选
const opts=(key,lab)=>[...new Set(IT.map(x=>x[key]).filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">${esc(lab?lab(v):v)}</option>`).join('');
function renderF(){
  const scs=F.uc?[...new Set([...IT.filter(x=>x.uc===F.uc).map(SX),...D.batches.filter(b=>b.uc===F.uc&&b.n!=null).map(b=>b.sc||'（没写）')])]:[];
  document.getElementById('filters').innerHTML=`<select data-f="t"><option value="">全部类型</option>${[...new Set(IT.map(ty))].sort((a,b)=>tyo(a)-tyo(b)).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select>
<select data-f="g"><option value="">全部来源</option>${[...new Set(IT.map(x=>x.g))].sort((a,b)=>so(a)-so(b)).map(g=>`<option value="${esc(g)}">${esc(sn(g))}</option>`).join('')}</select>
<select data-f="k"><option value="">全部分类</option>${Object.entries(D.kinds).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}<option value="VS">变式合计</option></select>
<select data-f="l1"><option value="">全部一级分类</option>${opts('l1')}</select>
<select data-f="uc"><option value="">全部 use case</option>${opts('uc',k=>k+(UCN[k]?' '+UCN[k]:''))}</select>
${F.uc?`<select data-f="sc"><option value="">${esc(F.uc)} 全部细分场景（${scs.length}）</option>${scs.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select>`:''}
<input data-f="q" type="search" placeholder="搜素材名">
<span class="cnt" id="cnt"></span>`;syncF()}
const syncF=()=>document.querySelectorAll('#filters [data-f]').forEach(e=>{e.value=F[e.dataset.f]});
document.getElementById('filters').addEventListener('change',ev=>{const e=ev.target.closest('select[data-f]');if(!e)return;F[e.dataset.f]=e.value;if(e.dataset.f==='uc'){F.sc='';renderF()}draw()});
document.getElementById('filters').addEventListener('input',ev=>{const e=ev.target.closest('input[data-f]');if(!e)return;F.q=e.value;draw()});
renderF();
const KB={'变式':'V','同脚本换画面':'S','自己发挥':'N','':'N'};
const bk=b=>b.n==null?'N':KB[b.k]??'N';
const OPEN=new Set();const KO={V:0,S:1,N:2,X:3};
function draw(){
  const pass=x=>(!F.g||x.g===F.g)&&(!F.k||(F.k==='VS'?isVar(x):x.k===F.k))&&(!F.t||ty(x)===F.t)&&(!F.l1||x.l1===F.l1)&&(!F.uc||x.uc===F.uc)&&(!F.sc||SX(x)===F.sc)&&(!F.q||x.name.toLowerCase().includes(F.q.toLowerCase()));
  const passB=b=>b.n!=null&&(!F.g||b.g===F.g)&&(!F.k||(F.k==='VS'?['V','S'].includes(bk(b)):bk(b)===F.k))&&(!F.uc||b.uc===F.uc)&&(!F.sc||(b.sc||'（没写）')===F.sc)&&(!F.q);
  const L=IT.filter(pass),v=L.filter(isVar).length,c=L.filter(CNT).length;
  const cw=L.filter(x=>!AGS.includes(x.g)&&CNT(x)).length;document.getElementById('cnt').textContent=`${L.length} 条（唯西 ${cw} 条，变式占 ${cw?Math.round(v/cw*100):0}%；外部 ${L.length-L.filter(x=>!AGS.includes(x.g)).length} 条）`;
  const days=[...D.days].reverse();
  document.getElementById('list').innerHTML=days.map(d=>{
    const X=L.filter(x=>x.d===d).sort((a,b)=>tyo(ty(a))-tyo(ty(b))||so(a.g)-so(b.g)||(KO[a.k]??9)-(KO[b.k]??9)||String(a.uc).localeCompare(b.uc));
    const P=D.batches.filter(b=>b.d===d&&passB(b)),open=P.filter(b=>b.got<b.n).sort((a,b)=>KO[bk(a)]-KO[bk(b)]||a.g.localeCompare(b.g)||String(a.uc).localeCompare(b.uc));
    const Q=(D.pend||[]).filter(x=>x.d===d&&(!F.g||x.g===F.g)&&(!F.t||ty(x)===F.t)&&(!F.uc||x.uc===F.uc)&&(!F.k||(F.k==='VS'?isVar(x):x.k===F.k))&&(!F.q||x.name.toLowerCase().includes(F.q.toLowerCase()))&&x.k!=='X').sort((a,b)=>a.st.localeCompare(b.st)||a.g.localeCompare(b.g));
    if(!X.length&&!P.length&&!Q.length)return '';
    const sm=g=>{const n=X.filter(x=>x.g===g&&CNT(x)).length,pl=P.filter(b=>b.g===g).reduce((a,b)=>a+b.n,0);const q=Q.filter(x=>x.g===g).length;return (n||pl||q)?`<span>${sn(g)} 通过 <b>${n}</b>${pl?` / 排 ${pl}`:''}${q?` <small class="st-mu">另有 ${q} 条没通过</small>`:''}</span>`:''};
    const head=`<div class="dayh"><b>${md(d)} 周${wd(d)}</b>${d===D.T?'<span class="st-mu">今天</span>':d>D.T?'<span class="st-mu">还没到</span>':''}${sm('A')}${sm('B')}${(()=>{const n=X.filter(x=>AGS.includes(x.g)).length;return n?`<span>外部 agency <b>${n}</b></span>`:''})()}</div>`;
    const tbl=X.length?`<div class="scroll list"><table><thead><tr><th>类型</th><th>来源</th><th>分类</th><th>一级分类</th><th>Use case</th><th>细分场景（变式写换了什么）</th><th>照哪个头部模板</th><th>成片</th><th class="n">累计消耗</th></tr></thead><tbody>${X.map(x=>`<tr><td class="nw"><span class="ty">${esc(ty(x))}</span></td><td class="nw">${esc(sn(x.g))}</td><td>${x.k==='O'?'<span class="st-mu">—</span>':`<span class="k k${x.k}">${D.kinds[x.k]}</span>`}</td><td class="nw">${esc(x.l1)}</td><td class="nw">${x.uc?`<code>${esc(x.uc)}</code> ${esc(x.ucn)}`:''}</td><td>${esc(x.var||x.sc||'')}</td><td class="nw">${x.tn?`<a href="${esc(x.tl)}" target="_blank" rel="noopener">${esc(x.tn)}</a>`:'<span class="st-mu">—</span>'}</td><td class="nm"><a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.name)}</a> <span class="lk">${x.lk==='v'?'视频':'飞书'}</span></td><td class="n">${x.k==='O'?'<span class="st-mu">—</span>':x.cost?money(x.cost):x.mid?'¥0':'没上线'}</td></tr>`).join('')}</tbody></table></div>`:(d<=D.T?'<p class="note">这天还没有审核通过的成片。</p>':'');
    const op=OPEN.has(d);
    const plan=open.length?`<div class="plan${op?' open':''}" data-d="${d}"><div class="ph">${op?'▾':'▸'} 这天还排着没交的：${open.length} 项、${open.reduce((a,b)=>a+b.n-b.got,0)} 条</div>${op?`<div class="scroll list"><table><thead><tr><th>来源</th><th>分类</th><th>Use case</th><th>细分场景 / 做什么</th><th>照哪个头部模板</th><th class="n">排了</th><th class="n">已交</th></tr></thead><tbody>${open.map(b=>`<tr><td class="nw">${esc(sn(b.g))}</td><td><span class="k k${bk(b)}">${D.kinds[bk(b)]}</span></td><td class="nw">${b.uc&&b.uc!=='自选'?`<code>${esc(b.uc)}</code> ${esc(UCN[b.uc]||'')}`:'自选'}</td><td>${esc(b.sc||'')}${b.how?`<small class="note" style="display:block;margin:2px 0 0">${esc(b.how)}</small>`:''}</td><td class="nw">${b.tn?`<a href="${esc(b.tl)}" target="_blank" rel="noopener">${esc(b.tn)}</a>`:'<span class="st-mu">—</span>'}</td><td class="n">${b.n}</td><td class="n">${b.got}</td></tr>`).join('')}</tbody></table></div>`:''}</div>`:'';
    const qk='p'+d,qo=OPEN.has(qk);
    const pq=Q.length?`<div class="plan${qo?' open':''}" data-d="${qk}"><div class="ph">${qo?'▾':'▸'} 交了但还没通过（不算数）：${Q.length} 条</div>${qo?`<div class="scroll list"><table><thead><tr><th>类型</th><th>来源</th><th>状态</th><th>分类</th><th>Use case</th><th>素材名</th></tr></thead><tbody>${Q.map(x=>`<tr><td class="nw">${esc(ty(x))}</td><td class="nw">${esc(sn(x.g))}</td><td class="nw">${esc(x.st)}</td><td><span class="k k${x.k}">${D.kinds[x.k]}</span></td><td class="nw">${x.uc?`<code>${esc(x.uc)}</code> ${esc(x.ucn)}`:''}</td><td class="nm">${esc(x.name)}</td></tr>`).join('')}</tbody></table></div>`:''}</div>`:'';
    return `<section class="day">${head}${tbl}${pq}${plan}</section>`}).join('');
}
document.getElementById('list').addEventListener('click',ev=>{const h=ev.target.closest('.plan .ph');if(!h)return;const d=h.parentElement.dataset.d;OPEN.has(d)?OPEN.delete(d):OPEN.add(d);draw()});
draw();
</script>
</body>
</html>
